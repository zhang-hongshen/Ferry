name: Release

on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: ${{ vars.XCODE_VERSION || '27.0' }}
  SCHEME: Ferry
  PROJECT: Ferry.xcodeproj

jobs:
  macos:
    name: Build and publish (macOS)
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/checkout turns an annotated tag into a lightweight one; fetch it again for the release notes.
      - name: Fetch the annotated tag
        run: git fetch --force --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Select Xcode
        run: |
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$XCODE_APP" ]]; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Read version and app name from the Xcode project
        id: meta
        env:
          HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
        run: |
          # The release tag sets the version; the app name comes from the project.
          SETTINGS="$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -showBuildSettings -json MARKETING_VERSION="$GITHUB_REF_NAME")"
          read_setting() {
            echo "$SETTINGS" | jq -r --arg key "$1" \
              '.[] | select(.target == "Ferry") | .buildSettings[$key] // empty'
          }
          VERSION="$(read_setting MARKETING_VERSION)"
          DISPLAY_NAME="$(read_setting INFOPLIST_KEY_CFBundleDisplayName)"
          [[ -n "$DISPLAY_NAME" ]] || DISPLAY_NAME="$(read_setting PRODUCT_NAME)"

          TAG="${GITHUB_REF_NAME}"
          if [[ "${VERSION}" != "${TAG}" ]]; then
            echo "::error::Tag ${TAG} does not match the app version ${VERSION} (Xcode → target Ferry → General → Version)"
            exit 1
          fi
          # File-system friendly artifact name, e.g. "My App" → "My-App-0.1.0.dmg"
          DMG_NAME="$(echo "${DISPLAY_NAME}" | tr ' ' '-')-${VERSION}.dmg"
          {
            echo "version=${VERSION}"
            echo "display_name=${DISPLAY_NAME}"
            echo "dmg_name=${DMG_NAME}"
            [[ "${VERSION}" == *-* ]] && echo "prerelease=true" || echo "prerelease=false"
            echo "signed=${HAS_CERTIFICATE}"
          } >> "$GITHUB_OUTPUT"
          [[ "$HAS_CERTIFICATE" == "true" ]] \
            || echo "::warning::No signing certificate in the repository secrets; publishing an unsigned DMG"

      - name: Import signing certificate into a temporary keychain
        if: steps.meta.outputs.signed == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Developer ID Application" \
            || { echo "::error::No 'Developer ID Application' identity found in the certificate"; exit 1; }

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNED: ${{ steps.meta.outputs.signed }}
        run: |
          if [[ "$SIGNED" == "true" ]]; then
            SIGNING=(
              CODE_SIGN_IDENTITY="Developer ID Application"
              DEVELOPMENT_TEAM="$TEAM_ID"
              OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN_PATH"
            )
          else
            # Ad-hoc signature: Apple silicon refuses to run code with no signature at all.
            SIGNING=(CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          fi
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_HARDENED_RUNTIME=YES \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${SIGNING[@]}"

      - name: Take the unsigned app from the archive
        if: steps.meta.outputs.signed != 'true'
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          [[ -n "$APP_PATH" ]] || { echo "::error::Archived .app not found"; exit 1; }
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Export Developer ID app
        if: steps.meta.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>teamID</key><string>${TEAM_ID}</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          APP_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.app' -print -quit)"
          [[ -n "$APP_PATH" ]] || { echo "::error::Exported .app not found"; exit 1; }
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create DMG
        env:
          DMG_NAME: ${{ steps.meta.outputs.dmg_name }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
        run: |
          DMG_PATH="$RUNNER_TEMP/$DMG_NAME"
          STAGING="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGING"
          ditto "$APP_PATH" "$STAGING/$(basename "$APP_PATH")"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "$DISPLAY_NAME" -srcfolder "$STAGING" -fs APFS -format UDZO -ov "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Sign, notarize and staple DMG
        if: steps.meta.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --sign "Developer ID Application" --timestamp --keychain "$KEYCHAIN_PATH" "$DMG_PATH"

          # Notarizing the DMG also covers the signed app inside it.
          NOTARY_RESULT="$RUNNER_TEMP/notary.json"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" \
            --wait --timeout 30m --output-format json > "$NOTARY_RESULT"
          if [[ "$(plutil -extract status raw -o - "$NOTARY_RESULT")" != "Accepted" ]]; then
            xcrun notarytool log "$(plutil -extract id raw -o - "$NOTARY_RESULT")" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" || true
            exit 1
          fi
          xcrun stapler staple "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG_PATH"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          SIGNED: ${{ steps.meta.outputs.signed }}
        run: |
          (cd "$(dirname "$DMG_PATH")" && shasum -a 256 "$(basename "$DMG_PATH")" > "$DMG_PATH.sha256")

          NOTES="$RUNNER_TEMP/notes.md"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > "$NOTES"

          flags=(--title "$VERSION" --notes-file "$NOTES" --verify-tag)
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            "$DMG_PATH" \
            "$DMG_PATH.sha256"

      - name: Clean up keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
